name: Build MediaHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build MediaHub APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract mediahub.zip
        run: |
          rm -rf mediahub-build
          mkdir mediahub-build
          unzip -q mediahub.zip -d mediahub-build

      - name: Find Android project
        run: |
          PROJECT_DIR="$(dirname "$(find mediahub-build -name 'settings.gradle.kts' -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Fix KSP version
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ["PROJECT_DIR"])
          toml = project / "gradle" / "libs.versions.toml"

          if not toml.exists():
              raise SystemExit(f"ERROR: {toml} not found")

          text = toml.read_text(encoding="utf-8")

          old = 'googleDevtoolsKsp = "2.3.5"'
          new = 'googleDevtoolsKsp = "2.3.6"'

          if old in text:
              text = text.replace(old, new)
              print("KSP changed: 2.3.5 -> 2.3.6")
          elif 'googleDevtoolsKsp = "2.3.6"' in text:
              print("KSP is already 2.3.6")
          else:
              print("WARNING: KSP version line was not found")

          toml.write_text(text, encoding="utf-8")
          PY

      - name: Create debug.keystore
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            echo "Creating debug.keystore..."

            keytool -genkeypair \
              -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

          else
            echo "debug.keystore already exists."
          fi

          ls -lh "$PROJECT_DIR/debug.keystore"

      - name: Check Firebase configuration
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          echo "Checking Google Services..."

          find "$PROJECT_DIR" \
            -name "google-services.json" \
            -print || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Clean previous build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle clean --no-daemon

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        if: always()
        env:
          PROJECT_DIR: ${{ env.PROJECT_DIR }}
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MediaHub-debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
