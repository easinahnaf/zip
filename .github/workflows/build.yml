name: Android APK Build

on:
  push:
    branches: [ "mediahub-unpacked" ]
  pull_request:
    branches: [ "mediahub-unpacked" ]
  workflow_dispatch: # এর মাধ্যমে আপনি নিজে বাটন চেপেও বিল্ড শুরু করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # আপনার প্রজেক্টের রুট ডিরেক্টরিতে gradlew ফাইলটি না থাকলে এটি তা তৈরি করে নেবে
    - name: Generate Gradle Wrapper if missing
      run: |
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MediaHub-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
